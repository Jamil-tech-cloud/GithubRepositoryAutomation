name: Bug report
description: Report a defect in the sample app or automation
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What's wrong?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context (logs, screenshots, environment)
    validations:
      required: false
