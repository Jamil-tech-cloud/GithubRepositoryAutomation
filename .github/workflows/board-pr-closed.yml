name: Board - PR Closed Without Merging

# PR into dev closed without merging -> issue back to In Progress.
# (A merged PR is handled separately: it stays Development Done until the QA
# deploy workflow promotes it, per docs/POC.md.)

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  contents: read

jobs:
  move-issue:
    if: github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse linked issue
        id: parse
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if issue_number=$(scripts/parse-linked-issue.sh); then
            echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          else
            echo "No linked issue found on this PR; nothing to move."
            echo "issue_number=" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/set-issue-status
        if: steps.parse.outputs.issue_number != ''
        with:
          issue-number: ${{ steps.parse.outputs.issue_number }}
          target-status: In Progress
          project-owner: ${{ vars.PROJECT_OWNER }}
          project-number: ${{ vars.PROJECT_NUMBER }}
          project-token: ${{ secrets.PROJECT_TOKEN }}
          repo: ${{ github.repository }}
