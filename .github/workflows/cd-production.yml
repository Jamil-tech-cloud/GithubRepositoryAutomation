name: CD - Production

# Runs when a change lands on main (via the dev -> main promotion PR).
# The deploy job targets the `production` environment, which requires a human
# reviewer to approve before any deployment runs. Claude never triggers this.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Test
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release
          dotnet test --no-build --configuration Release

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://${{ vars.VPS_HOST }}
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      IMAGE: sampleapi:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Build image
        run: docker build -t "$IMAGE" .

      - name: Ship image to VPS
        run: |
          docker save "$IMAGE" | gzip | \
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "$VPS_USER@$VPS_HOST" 'gunzip | docker load'

      - name: Run new container
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "
            docker rm -f sampleapi >/dev/null 2>&1 || true
            docker run -d --name sampleapi --restart unless-stopped -p 80:8080 $IMAGE
            docker image prune -f >/dev/null
          "

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "http://$VPS_HOST/health"; then
              echo; echo "Deployed $IMAGE"; exit 0
            fi
            sleep 3
          done
          echo "Health check failed"; exit 1

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
