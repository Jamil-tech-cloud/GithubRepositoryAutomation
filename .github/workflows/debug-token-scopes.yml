name: Debug - Token Scopes (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Print PROJECT_TOKEN scopes
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: gh api -i /user 2>&1 | grep -i "x-oauth-scopes\|x-github-media-type\|HTTP/"
