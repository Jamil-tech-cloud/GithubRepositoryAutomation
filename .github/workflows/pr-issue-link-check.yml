name: PR Issue Link Check

# Required status check: every PR into dev must reference the issue it resolves,
# either via a `Closes #N` / `Fixes #N` / `Resolves #N` line in the PR body, or via a
# `feature/N-...` branch name. This is enforced here (not just left to GitHub's native
# keyword auto-close) because auto-close-on-merge only applies when a PR targets the
# repo's default branch, and our PRs target `dev`, not the default branch (`main`).
#
# SECURITY: the PR body/branch name are untrusted, attacker-controlled text. They are only
# ever read via env vars and matched with a fixed regex — never interpolated into a shell
# command or `run:` template string.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [dev]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  check-issue-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PR body and branch name for a linked issue
        id: parse
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if issue_number=$(scripts/parse-linked-issue.sh); then
            echo "Linked issue: #$issue_number"
            echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No linked issue found. Add 'Closes #N' to the PR description or name the branch 'feature/N-<slug>'."
            exit 1
          fi
